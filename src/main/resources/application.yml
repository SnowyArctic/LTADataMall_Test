spring:
  application:
    name: transit-feed
  datasource:
    # Production: set SPRING_DATASOURCE_URL / USERNAME / PASSWORD env vars
    # (managed PostgreSQL, e.g. Tiger Cloud). Falls back to in-memory H2.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:transitfeed;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  address: 0.0.0.0

lta:
  api:
    base-url: ${LTA_API_BASE_URL:https://datamall2.mytransport.sg/ltaodataservice}
    # Required in production; requests fail fast with a clear error when missing.
    account-key: ${LTA_ACCOUNT_KEY:}
    bus-stop-code: ${LTA_BUS_STOP_CODE:83139}

transit:
  persistence:
    enabled: ${TRANSIT_PERSISTENCE_ENABLED:true}
    retention-minutes: ${TRANSIT_RETENTION_MINUTES:60}

logging:
  level:
    com.transitfeed: INFO
